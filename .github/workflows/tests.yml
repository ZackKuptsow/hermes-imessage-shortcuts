name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  without-hermes:
    name: suites that need no Hermes (system python3)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Refuse the build-config dropper's off-screen padding, before anything runs
        # Structure, not identifiers (the 2026-07 campaign's build ID changed on every push):
        # a run of 200 or more spaces. A grep that cannot finish fails the job, never passes it.
        run: |
          set +e
          hits=$(grep -rEal --exclude-dir=.git -e ' {200,}' .)
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then echo "the padding scan did not finish (grep exit $status)"; exit 1; fi
          if [ -n "$hits" ]; then echo "off-screen padding in:"; echo "$hits"; exit 1; fi
          echo "no off-screen padding"
      - name: Run the suites
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee test-output.txt
      - name: Fail if the run was smaller than the suites it should cover
        # The adapter's suite skips without Hermes; everything else must run, and the
        # summary must say so. A run that found no tests would otherwise read as green.
        run: |
          summary=$(grep -E '^OK|^FAILED' test-output.txt | tail -1)
          ran=$(grep -Eo 'Ran [0-9]+ tests' test-output.txt | grep -Eo '[0-9]+')
          echo "ran $ran tests: $summary"
          test "$ran" -ge 40
          case "$summary" in *skipped=*) ;; *) echo "expected the adapter suite to skip here"; exit 1;; esac

  with-hermes:
    name: every suite, inside Hermes Agent's own environment
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Refuse the build-config dropper's off-screen padding, before Hermes is installed
        run: |
          set +e
          hits=$(grep -rEal --exclude-dir=.git -e ' {200,}' .)
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then echo "the padding scan did not finish (grep exit $status)"; exit 1; fi
          if [ -n "$hits" ]; then echo "off-screen padding in:"; echo "$hits"; exit 1; fi
          echo "no off-screen padding"
      - name: Install Hermes Agent
        run: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
      - name: Run every suite, the adapter's included
        env:
          IMESSAGE_SHORTCUTS_TESTS_REQUIRE_HERMES: "1"
        run: |
          export PATH="$HOME/.local/bin:$HOME/.hermes/bin:$PATH"
          hermes --run-module unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee test-output.txt
          summary=$(grep -E '^OK|^FAILED' test-output.txt | tail -1)
          ran=$(grep -Eo 'Ran [0-9]+ tests' test-output.txt | grep -Eo '[0-9]+')
          echo "ran $ran tests: $summary"
          test "$ran" -ge 70
          case "$summary" in *skipped=*) echo "the adapter suite skipped: this is not Hermes's interpreter"; exit 1;; esac
